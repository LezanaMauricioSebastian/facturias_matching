<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FacturIA → CSV (Proceso)</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <div class="wrap">
      <div class="grid">
        <div class="card actionCard">
          <div class="title actionTitle" id="actionTitle">CSV generado desde datos consultados y editados, listo para usar en Odoo.</div>
          <div class="controlsRow">
            <div class="searchBar" id="searchBar">
              <div class="field">
                <label>Número de proceso</label>
                <input id="processNumber" type="text" placeholder="Ej: 137 (20 facturas)">
              </div>
              <button id="btnBuscar" type="button">Buscar</button>
            </div>
            <div class="btnGroupWrap">
              <div class="btnGroup btnGroupSecondary">
                <button id="btnRevertir" class="secondary btnRevert" type="button" disabled>Restaurar original</button>
                <button id="btnRematchExcel" class="secondary btnRematch" type="button" disabled hidden>Re-matchear</button>
              </div>
              <div class="btnGroup btnGroupPrimary">
                <button id="btnOdooImport" class="secondary" type="button" disabled>Importar a Odoo</button>
                <button id="btnCopiarCsv" class="secondary" type="button" disabled title="Copia el CSV al portapapeles para pegarlo en Excel o Sheets">
                  Copiar CSV
                </button>
                <button id="btnDescargar" class="downloadBtn" type="button" disabled>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 3v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                  Descargar CSV
                </button>
              </div>
            </div>
          </div>
          <div class="contextRow">
            <div class="contextRowTop">
              <div class="hint actionHint" id="actionHint">Revisá/ajustá los campos editables y descargá el CSV final.</div>
              <span id="odooTenantBadge" class="odooTenantBadge" hidden></span>
            </div>
            <div id="status" class="status"></div>
          </div>
        </div>

        <div class="card processCard">
          <div class="processTabs" id="processTabs" hidden>
            <button type="button" class="processTab active" data-process-tab="edit">Edición</button>
            <button type="button" class="processTab" data-process-tab="facturia">FacturIA</button>
          </div>
          <div class="processTabPanel" data-process-panel="edit">
            <div class="processViewBar">
              <div class="hint summaryHint" id="summary"></div>
              <div class="processViewActions">
                <label class="unifiedOneLineToggle" id="soloEncabezadoToggle" hidden title="Colapsa todas las facturas a una línea (guarda las líneas para poder destildar). Con 1 línea se oculta el pie y los montos van en la fila">
                  <input type="checkbox" id="chkSoloEncabezado" />
                  <span>Solo encabezado</span>
                </label>
                <div class="viewModeToggle" role="group" aria-label="Vista de comprobantes">
                  <button type="button" class="viewModeBtn active" data-view-mode="lista" id="btnViewLista">Lista</button>
                  <button type="button" class="viewModeBtn" data-view-mode="carrusel" id="btnViewCarrusel">Carrusel</button>
                </div>
                <button type="button" class="expandViewBtn secondary" id="btnExpandView" aria-pressed="false" title="Ampliar" aria-label="Ampliar vista">
                  <span class="expandViewIcon" aria-hidden="true">▢</span>
                </button>
              </div>
            </div>
            <div id="carouselNav" class="carouselNav" hidden>
              <button type="button" class="secondary carouselNavBtn" id="btnCarouselPrev" aria-label="Comprobante anterior">‹</button>
              <span class="carouselNavLabel" id="carouselNavLabel">1 / 1</span>
              <button type="button" class="secondary carouselNavBtn" id="btnCarouselNext" aria-label="Comprobante siguiente">›</button>
            </div>
            <div id="ocPickerBar" class="ocPickerBar" hidden></div>
            <div class="tableScroll">
              <div id="tableWrap"></div>
            </div>
            <div class="footerBar footerInside">
              <div></div>
              <div class="totalBox">
                Total del proceso: <strong id="totalGeneral">$0.00</strong>
              </div>
            </div>
          </div>
          <div class="processTabPanel" data-process-panel="facturia" hidden>
            <div class="hint">JSON crudo que mandó FacturIA (`json_data`). Solo visible en staging/dev.</div>
            <pre id="facturiaRaw" class="facturiaRaw" aria-label="json_data FacturIA">Cargá un proceso para ver el JSON.</pre>
          </div>
        </div>
      </div>
    </div>
    <dialog id="ocPickerDialog" class="ocPickerDialog">
      <div class="ocPickerDialogPanel">
        <header class="ocPickerDialogHeader">
          <h2 class="ocPickerDialogTitle">Seleccionar OC</h2>
          <button type="button" class="ocPickerClose secondary" data-close-oc aria-label="Cerrar">×</button>
        </header>
        <div class="ocPickerDialogBody"></div>
      </div>
    </dialog>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
